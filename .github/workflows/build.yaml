name: Refresh profile card
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [facts.json, "portrait_*.txt", build_svg.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh stats and re-render SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json dark_mode.svg light_mode.svg
          git commit -m "chore: refresh profile card" || echo "No changes"
          git push
